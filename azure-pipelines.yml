trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: UseNode@1
    inputs:
      version: "22.x"
    displayName: "Use Node.js 22"

  - script: |
      npm ci
    displayName: "Install dependencies"

  - script: |
      npm run lint
    displayName: "Lint"

  # Enable once tests exist.
  # - script: |
  #     npm test
  #   displayName: "Test"

  - script: |
      npm run build
    displayName: "Build"
