trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
    displayName: "Use Node.js 20"

  - script: |
      npm ci
    displayName: "Install dependencies"

  - script: |
      npm run lint
    displayName: "Lint"

  # Lisää vasta kun testit olemassa.
  # - script: |
  #     npm test
  #   displayName: "Test"

  - script: |
      npm run build
    displayName: "Build"
